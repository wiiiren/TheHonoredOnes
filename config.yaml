# Every tunable value lives here; nobody hard-codes one.
# Owner: Person A (engine). Tell Person B before changing anything the app reads.

open: "08:00"
close: "16:00"
tick_min: 5
wait_limit_min: 30

# Assumed arrivals. Used only when calibration is off or data/calibration.json is missing.
arrivals_per_hour: {default: 12, peak: 22, peak_from: "09:00", peak_to: "11:00"}

# staff and service_min are assumptions (the real log has no usable service times or
# staff counts for these stations). share is overridden by calibration where measured.
stations:
  registration: {staff: 2, service_min: 4,  share: 1.00, weight: 1.0, staff_label: clerks}
  consultation: {staff: 4, service_min: 10, share: 1.00, weight: 1.5, staff_label: doctors}
  laboratory:   {staff: 1, service_min: 6,  share: 0.35, weight: 1.0, staff_label: technicians}
  imaging:      {staff: 1, service_min: 12, share: 0.15, weight: 1.0, staff_label: radiographers}
  pharmacy:     {staff: 2, service_min: 7,  share: 0.65, weight: 1.2, staff_label: pharmacists}

# Service times are lognormal with this spread (standard deviation / mean).
service_cv: 0.5

# Real-log calibration. When `use` is true and the file exists it overrides
# arrivals_per_hour (hourly shape and weekday factors) and the laboratory and imaging shares.
calibration:
  use: true
  file: data/calibration.json
  # Arrival volume is scaled so consultation is this busy in the peak hour of an average weekday.
  target_peak_util: 0.92

# Raise on `ticks` consecutive checks at or above raise_at; clear after `ticks` below clear_at.
# Chosen on the 10 tuning days by eval/tune_alerts.py (false-alarm budget: one per day);
# the starting guess was 0.60 and 0.40. See eval/tuning.json for the sweep.
alert: {raise_at: 0.30, clear_at: 0.20, ticks: 2, false_alarm_budget_per_day: 1.0}

forecast: {runs: 30, horizons_min: [15, 30, 60], seed: 7}

# Recent service speed = observed mean service time / usual. Treated as 1.0 unless the
# evidence is clear (z-score at least min_z), then shrunk towards 1.0 with `shrink_k`
# pseudo-observations (few completions say little) and clipped to `clip`. When averaging,
# any single case is capped at cap_ratio x the usual time so one long case is not a slowdown.
service_speed: {clip: [0.7, 2.0], shrink_k: 4, min_z: 1.75, cap_ratio: 2.5}

# mixed when the second cause explains at least mixed_ratio of the first; peak_load when
# no cause explains min_contribution_min. Patients already waiting are put down to a surge
# only when recent arrivals are clearly above usual (z-score at least demand_min_z).
diagnose: {mixed_ratio: 0.8, min_contribution_min: 3, demand_min_z: 2.0}

# A move is recommended only if it cuts the target station's 60-minute wait by at least
# min_gain_min, saves at least min_total_saved_patient_min of waiting across the clinic,
# and leaves its donor station comfortable: in 9 forecast runs out of 10 the donor's wait
# stays under donor_max_wait_min for the whole hour.
recommend: {min_gain_min: 2.0, min_total_saved_patient_min: 1.0, donor_max_wait_min: 20}

action_duration_min: 60

allowed_moves:   # assumption: a moved staff member works at full speed
  - {id: clerk_to_pharmacy, from: registration, to: pharmacy,
     label: "Move one registration clerk to the pharmacy counter"}
  - {id: nurse_to_lab, from: float, to: laboratory,
     label: "Send the float nurse to laboratory sample-taking"}
  - {id: open_reserve_room, from: float, to: consultation,
     label: "Open the reserve room with the on-call doctor"}
  - {id: open_third_desk, from: float, to: registration,
     label: "Open a third registration desk with the float clerk"}
  - {id: fast_track_pharmacy, station: pharmacy, service_scale: 0.8,
     label: "Fast-track repeat prescriptions at pharmacy"}

# Injected disruptions with a known cause. Starts fall in the busy part of the day.
scenarios:
  start_from: "09:30"
  start_to: "11:30"
  demand_surge:    {strength: [1.6, 2.0], duration_min: [60, 90]}
  staffing_gap:    {stations: [consultation, pharmacy, registration], duration_min: [120, 120]}
  slow_processing: {stations: [consultation, pharmacy, imaging, registration],
                    strength: [1.5, 1.5], duration_min: [60, 90]}

# 90 stored day specs (data/days.json): 42 normal, 16 of each scenario type.
days:
  base_seed: 20261010
  weekdays: [0, 1, 2, 3, 4, 5]          # Monday to Saturday
  split:
    train: {normal: 28, demand_surge: 11, staffing_gap: 11, slow_processing: 10}
    tune:  {normal: 4,  demand_surge: 2,  staffing_gap: 2,  slow_processing: 2}
    test:  {normal: 10, demand_surge: 3,  staffing_gap: 3,  slow_processing: 4}
  two_cause: 12                         # robustness days, never used for training or tuning
